services:
  string:
    build: ./string
    ports: ["8100:8100"]
    volumes:
      - ./data:/data
      - ./lexicons:/lexicons:ro
    environment:
      STRING_DB: /data/string.db
      STRING_LEXICONS: /lexicons
      STRING_MEDIA: /data/media
      # STRING_TOKEN: change-me        # uncomment to require auth
    restart: unless-stopped

  appview:
    build: ./appview
    ports: ["8104:8104"]
    volumes:
      - ./data:/data
    environment:
      APPVIEW_DB: /data/appview.db
      # comma-separated handles/DIDs to index at startup (existing repos)
      APPVIEW_SEED: ""
      # APPVIEW_LIVE: "0"   # set to disable the firehose and index on demand
    restart: unless-stopped

  pocket:
    image: nginx:alpine
    ports: ["8103:80"]
    volumes:
      - ./pocket:/usr/share/nginx/html:ro
    restart: unless-stopped

  easel:
    image: nginx:alpine
    ports: ["8105:80"]
    volumes:
      - ./easel:/usr/share/nginx/html:ro
    restart: unless-stopped

  timeline:
    image: nginx:alpine
    ports: ["8101:80"]
    volumes:
      - ./timeline:/usr/share/nginx/html:ro
    restart: unless-stopped

  studio:
    image: nginx:alpine
    ports: ["8102:80"]
    volumes:
      - ./studio:/usr/share/nginx/html:ro
    restart: unless-stopped
    # Note: Web Serial (USB pull/push/clear) requires a secure context.
    # http://localhost:8102 qualifies; a LAN IP does not — use Tailscale
    # HTTPS or open the file directly if accessing from another machine.

